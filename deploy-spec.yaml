app: anyship-demo-loan-desk
source:
  repo: https://github.com/jaedong29/anyship-demo-loan-desk
build:
  dockerfile: Dockerfile
  runtime_hint: python3.12
port: 8080
healthcheck: /healthz
ingress: public
env: []
backing_services:
  - type: postgres
    bind_as: DATABASE_URL
workload:
  type: request-driven
  scale_to_zero: false
  max_request_seconds: 10
  websocket: false
processes:
  web:
    instances: 1
release:
  migrate: python -m app.migrate
profile: dev
